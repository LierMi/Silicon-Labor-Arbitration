<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img" aria-label="TaskEscrow · On-chain State Machine — 8 contract states: creation → delivery → accept | dispute → settle → manual review (lifecycle diagram)"><rect width="100%" height="100%" fill="#020617"/>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Lifecycle bands -->
        <path d="M 72 112 L 908 112" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="100" class="t-dim" font-size="10" font-weight="600">01 / Task Lifecycle</text>
        <path d="M 72 264 L 908 264" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="252" class="t-dim" font-size="10" font-weight="600">02 / Dispute Resolution</text>
        <path d="M 72 436 L 908 436" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="424" class="t-dim" font-size="10" font-weight="600">03 / Terminal Outcomes</text>

        <!-- Primary lifecycle rail -->
        <path d="M 154 157 L 440 157" class="a-emphasis" stroke-width="2.2" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Transition paths -->
        <path d="M 153 157 L 343 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 94 188 L 94 309 Q 94 319 104 319 L 700 319 Q 710 319 710 329 L 710 450" class="a-dashed" stroke-width="1.1" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 402 188 L 402 319 L 402 319 L 402 450" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 402 188 L 402 233 L 402 233 L 402 278" class="a-security" stroke-width="1.1" marker-end="url(#arrowhead-security)"/>
        <path d="M 402 336 L 402 383 Q 402 393 412 393 L 546 393 Q 556 393 556 403 L 556 450" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 465 307 L 647 307" class="a-security" stroke-width="1.1" marker-end="url(#arrowhead-security)"/>
        <path d="M 710 336 L 710 383 Q 710 393 700 393 L 566 393 Q 556 393 556 403 L 556 450" class="a-dashed" stroke-width="1.1" marker-end="url(#arrowhead-dashed)"/>

        <!-- States -->
        <rect x="35" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="35" y="126" width="118" height="62" rx="7" class="c-frontend" stroke-width="1.5"/>
        <text x="45" y="140" class="t-frontend" font-size="7" font-weight="700">01</text>
        <text x="94" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Created</text>
        <text x="94" y="163" class="t-muted" font-size="7" text-anchor="middle">Funds locked · reqHash committed</text>

        <rect x="343" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="343" y="126" width="118" height="62" rx="7" class="c-backend" stroke-width="1.5"/>
        <text x="353" y="140" class="t-backend" font-size="7" font-weight="700">02</text>
        <text x="402" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Delivered</text>
        <text x="402" y="163" class="t-muted" font-size="7" text-anchor="middle">Agent submitted delivery hash</text>

        <rect x="339" y="278" width="126" height="58" rx="7" class="c-mask"/>
        <rect x="339" y="278" width="126" height="58" rx="7" class="c-backend" stroke-width="1.5"/>
        <text x="349" y="292" class="t-backend" font-size="7" font-weight="700">03</text>
        <text x="402" y="299" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Disputed</text>
        <text x="402" y="315" class="t-muted" font-size="7" text-anchor="middle">caseId created · Rules run</text>

        <rect x="647" y="278" width="126" height="58" rx="7" class="c-mask"/>
        <rect x="647" y="278" width="126" height="58" rx="7" class="c-cloud" stroke-width="1.5"/>
        <text x="657" y="292" class="t-cloud" font-size="7" font-weight="700">04</text>
        <text x="710" y="299" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Manual Review</text>
        <text x="710" y="315" class="t-muted" font-size="7" text-anchor="middle">Undecidable portion frozen</text>

        <rect x="343" y="450" width="118" height="58" rx="7" class="c-mask"/>
        <rect x="343" y="450" width="118" height="58" rx="7" class="c-database" stroke-width="1.5"/>
        <text x="402" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Accepted</text>
        <text x="402" y="487" class="t-muted" font-size="7" text-anchor="middle">Full escrow → agent</text>

        <rect x="497" y="450" width="118" height="58" rx="7" class="c-mask"/>
        <rect x="497" y="450" width="118" height="58" rx="7" class="c-database" stroke-width="1.5"/>
        <text x="556" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Settled</text>
        <text x="556" y="487" class="t-muted" font-size="7" text-anchor="middle">Objective + human portions released</text>

        <rect x="651" y="450" width="118" height="58" rx="7" class="c-mask"/>
        <rect x="651" y="450" width="118" height="58" rx="7" class="c-database" stroke-width="1.5"/>
        <text x="710" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Refunded</text>
        <text x="710" y="487" class="t-muted" font-size="7" text-anchor="middle">No delivery · deadline passed</text>

        <!-- Transition labels -->
        <rect x="202.8" y="136" width="90.4" height="16" rx="4" class="c-mask"/>
        <text x="248" y="147" class="t-backend" font-size="8" text-anchor="middle">submitDelivery()</text>

        <rect x="356.8" y="348" width="90.4" height="16" rx="4" class="c-mask"/>
        <text x="402" y="359" class="t-backend" font-size="8" text-anchor="middle">acceptDelivery()</text>
        <rect x="364.15" y="212" width="75.7" height="16" rx="4" class="c-mask"/>
        <text x="402" y="223" class="t-security" font-size="8" text-anchor="middle">openDispute()</text>
        <rect x="431.35" y="372" width="95.30000000000001" height="16" rx="4" class="c-mask"/>
        <text x="479" y="383" class="t-backend" font-size="8" text-anchor="middle">settle() frozen=0</text>
        <rect x="508.35" y="286" width="95.30000000000001" height="16" rx="4" class="c-mask"/>
        <text x="556" y="297" class="t-security" font-size="8" text-anchor="middle">settle() frozen&gt;0</text>
        <rect x="590.25" y="372" width="85.5" height="16" rx="4" class="c-mask"/>
        <text x="633" y="383" class="t-messagebus" font-size="8" text-anchor="middle">releaseFrozen()</text>

        <!-- Legend -->
        <text x="220" y="542" class="t-primary" font-size="10" font-weight="600">Legend</text>
        <rect x="220" y="554" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="240" y="562" class="t-muted" font-size="7">active state</text>
        <rect x="325" y="554" width="14" height="9" rx="2" class="c-cloud" stroke-width="1"/>
        <text x="345" y="562" class="t-muted" font-size="7">waiting</text>
        <rect x="415" y="554" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="435" y="562" class="t-muted" font-size="7">terminal success</text>
        <rect x="560" y="554" width="14" height="9" rx="2" class="c-security" stroke-width="1"/>
        <text x="580" y="562" class="t-muted" font-size="7">failure / exit</text>
      </svg>

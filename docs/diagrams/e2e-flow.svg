<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" role="img" aria-label="End-to-End Task Creation · Moss Path — createTask via MossBridge → simulate → E3 → wallet sign → on-chain confirm (workflow diagram)"><rect width="100%" height="100%" fill="#020617"/>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Swimlanes -->
        <rect x="40" y="52" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="74" class="t-dim" font-size="10" font-weight="600">01 / User / Wallet</text>

        <rect x="40" y="176" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="198" class="t-dim" font-size="10" font-weight="600">02 / Silicon Packages (Server-side)</text>

        <rect x="40" y="300" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="322" class="t-dim" font-size="10" font-weight="600">03 / Moss + Monad Testnet</text>

        <!-- Phase headers -->
        <line x1="42" y1="35" x2="266" y2="35" class="a-default" stroke-width="1.1"/>
        <rect x="42" y="27" width="224" height="16" rx="4" class="c-mask"/>
        <text x="154" y="39" class="t-muted" font-size="8" font-weight="600" text-anchor="middle">1. Prepare</text>
        <line x1="254" y1="35" x2="476" y2="35" class="a-default" stroke-width="1.1"/>
        <rect x="254" y="27" width="222" height="16" rx="4" class="c-mask"/>
        <text x="365" y="39" class="t-muted" font-size="8" font-weight="600" text-anchor="middle">2. Simulate &amp; E3</text>
        <line x1="454" y1="35" x2="671" y2="35" class="a-default" stroke-width="1.1"/>
        <rect x="454" y="27" width="217" height="16" rx="4" class="c-mask"/>
        <text x="562.5" y="39" class="t-muted" font-size="8" font-weight="600" text-anchor="middle">3. Sign &amp; Confirm</text>

        <!-- Workflow groups -->
        <rect x="38" y="338" width="637" height="58" rx="9" class="c-lane" stroke-width="1"/>
        <text x="48" y="352" class="t-backend" font-size="7" font-weight="600">Moss covers ONLY createTask</text>

        <!-- Edge paths -->
        <path d="M 134 119 L 134 166 L 165 166 L 165 243" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 220 269 L 220 290 L 300 290 L 300 333" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <path d="M 300 401 L 300 290 L 430 290 L 430 209" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <path d="M 485 243 L 485 166 L 454 166 L 454 119" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 500 145 L 500 228 L 625 228 L 625 341" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>

        <!-- Nodes -->
        <rect x="42" y="93" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="42" y="93" width="92" height="52" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="88" y="114" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">User Input</text>
        <text x="88" y="131" class="t-muted" font-size="8" text-anchor="middle">Task + MON amount</text>

        <rect x="165" y="217" width="110" height="52" rx="6" class="c-mask"/>
        <rect x="165" y="217" width="110" height="52" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="220" y="238" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">MossBridge</text>
        <text x="220" y="255" class="t-muted" font-size="8" text-anchor="middle">prepareCreateTask()</text>

        <rect x="254" y="333" width="92" height="68" rx="6" class="c-mask"/>
        <rect x="254" y="333" width="92" height="68" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="300" y="354" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Simulate</text>
        <text x="300" y="371" class="t-muted" font-size="8" text-anchor="middle">Capability → unsigned tx</text>
        <text x="300" y="389" class="t-cloud" font-size="7" text-anchor="middle">debug_traceCall</text>

        <rect x="375" y="209" width="110" height="68" rx="6" class="c-mask"/>
        <rect x="375" y="209" width="110" height="68" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="430" y="230" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Verify &amp; E3</text>
        <text x="430" y="247" class="t-muted" font-size="8" text-anchor="middle">No warnings → evidence</text>
        <text x="430" y="265" class="t-security" font-size="7" text-anchor="middle">gate</text>

        <rect x="454" y="93" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="454" y="93" width="92" height="52" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="500" y="114" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Wallet Sign</text>
        <text x="500" y="131" class="t-muted" font-size="8" text-anchor="middle">User reviews &amp; signs</text>

        <rect x="575" y="341" width="100" height="52" rx="6" class="c-mask"/>
        <rect x="575" y="341" width="100" height="52" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="625" y="362" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">TaskCreated</text>
        <text x="625" y="379" class="t-muted" font-size="8" text-anchor="middle">Tx confirmed on-chain</text>

        <!-- Edge labels -->






        <!-- Legend -->
        <text x="175" y="428" class="t-primary" font-size="10" font-weight="600">Legend</text>
        <rect x="175" y="440" width="14" height="9" rx="2" class="c-frontend" stroke-width="1"/>
        <text x="195" y="448" class="t-muted" font-size="7">User UI</text>
        <rect x="260" y="440" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="280" y="448" class="t-muted" font-size="7">Agent logic</text>
        <rect x="370" y="440" width="14" height="9" rx="2" class="c-security" stroke-width="1"/>
        <text x="390" y="448" class="t-muted" font-size="7">Policy</text>
        <rect x="455" y="440" width="14" height="9" rx="2" class="c-messagebus" stroke-width="1"/>
        <text x="475" y="448" class="t-muted" font-size="7">Tool action</text>
        <rect x="565" y="440" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="585" y="448" class="t-muted" font-size="7">Context / trace</text>
      </svg>

.sv-panel     { fill: rgba(15,23,42,0.5); stroke: #1e293b; }
/* Card dots */
.t-cyan    { fill: #22d3ee; }
.t-emerald { fill: #34d399; }
.t-violet  { fill: #a78bfa; }
.t-amber   { fill: #fbbf24; }
.t-rose    { fill: #fb7185; }
.t-orange  { fill: #fb923c; }
.t-slate   { fill: #94a3b8; }

</style>

        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">

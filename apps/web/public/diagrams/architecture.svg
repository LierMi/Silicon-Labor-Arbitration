<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-label="Silicon Labor Arbitration · System Architecture (Current) — Current monorepo runtime: Next.js demo + domain/rules/chain + Moss createTask seam + Monad Testnet (architecture diagram)"><style>
  /* 硅基劳动仲裁院 · 夜间档案室配色
     Archify 默认是蓝灰工程图，与我们的暗房+朱红不搭。
     这里只重定义变量，不改任何图形结构——重新生成图时覆盖本文件即可，
     把这段 style 再注一次就行（scripts/restyle-diagrams.py）。 */
  :root {
    --bg: transparent;
    --grid: rgba(214, 205, 185, 0.05);
    --mask: rgba(11, 9, 6, 0.72);

    --text: #f4efe4;
    --text-muted: #b8ae99;
    --text-dim: #7d7462;
    --arrow: #8a8272;
    --arrow-emphasis: #c0392b;

    --frontend-fill: rgba(233, 226, 209, 0.06);
    --frontend-stroke: #d6cdb9;
    --backend-fill: rgba(192, 57, 43, 0.09);
    --backend-stroke: #c0392b;
    --database-fill: rgba(233, 226, 209, 0.045);
    --database-stroke: #948b78;
    --cloud-fill: rgba(255, 202, 122, 0.07);
    --cloud-stroke: #e0a253;
    --security-fill: rgba(192, 57, 43, 0.07);
    --security-stroke: #c0392b;
    --messagebus-fill: rgba(233, 226, 209, 0.05);
    --messagebus-stroke: #a99f88;
    --external-fill: rgba(233, 226, 209, 0.035);
    --external-stroke: #6b6455;
    --lane-fill: rgba(233, 226, 209, 0.02);
    --lane-stroke: rgba(214, 205, 185, 0.14);
  }
  text { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .c-grid { stroke: var(--grid); fill: none; }
  .c-mask { fill: var(--mask); stroke: none; }
  .c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
  .c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
  .c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
  .c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
  .c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
  .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
  .c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
  .c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4,4; }
  .c-region { fill: rgba(255, 202, 122, 0.035); stroke: var(--cloud-stroke); stroke-dasharray: 8,4; }
  .c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6,6; }
  .c-bg-rect { fill: var(--bg); }
  .t-primary { fill: var(--text); }
  .t-muted { fill: var(--text-muted); }
  .t-dim { fill: var(--text-dim); }
  .t-frontend { fill: var(--frontend-stroke); }
  .t-backend { fill: var(--backend-stroke); }
  .t-database { fill: var(--database-stroke); }
  .t-cloud { fill: var(--cloud-stroke); }
  .t-security { fill: var(--security-stroke); }
  .t-messagebus { fill: var(--messagebus-stroke); }
  .t-external { fill: var(--external-stroke); }
  /* 连线用的是 a-* 前缀（不是 e-*）。漏定义的话 path 会按 SVG
     默认 fill:black 填成大黑块，把整张图糊掉。
     注意：本 style 块内绝不能出现尖括号，XML 解析器会当成标签。 */
  .a-default { stroke: var(--arrow); fill: none; stroke-width: 1.5; }
  .a-emphasis { stroke: var(--arrow-emphasis); fill: none; stroke-width: 1.8; }
  .a-dashed { stroke: var(--database-stroke); fill: none; stroke-width: 1.3; stroke-dasharray: 5,4; }
  .a-security { stroke: var(--security-stroke); fill: none; stroke-width: 1.5; }
  /* marker 跟随线宽会被放得很大，锁成绝对尺寸 */

  .e-emphasis { stroke: var(--arrow-emphasis); fill: none; }
  .e-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 5,4; }
  .e-security { stroke: var(--security-stroke); fill: none; }
  .m-default { fill: var(--arrow); }
  .m-emphasis { fill: var(--arrow-emphasis); }
  .m-security { fill: var(--security-stroke); }
  .m-dashed { fill: var(--database-stroke); }
</style>
